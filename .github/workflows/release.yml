name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: duotlet-release
  cancel-in-progress: false

jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-26
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      APP_PATH: build/Duotlet.app
      DIST_PATH: build/release

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Require stable release signing
        if: vars.DEVELOPER_ID_ENABLED != 'true'
        run: |
          echo "::error::Public releases require Developer ID signing. Ad-hoc updates invalidate Screen Recording authorization. Configure signing before publishing."
          exit 1

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Compute version metadata
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api --paginate --slurp "repos/$GH_REPO/releases" > "$RUNNER_TEMP/releases.json"
          VERSION="$(python3 scripts/release_metadata.py "$GITHUB_REF_NAME" --releases "$RUNNER_TEMP/releases.json")"
          {
            echo "version=$VERSION"
            echo "build=$VERSION"
            echo "label=$VERSION"
            echo "title=Duotlet $VERSION"
            echo "dmg=Duotlet-$VERSION.dmg"
            echo "zip=Duotlet-$VERSION.zip"
          } >> "$GITHUB_OUTPUT"

      - name: Validate signing secrets
        if: vars.DEVELOPER_ID_ENABLED == 'true'
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_NOTARY_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          for name in APPLE_CERTIFICATE_P12_BASE64 APPLE_CERTIFICATE_PASSWORD APPLE_TEAM_ID \
            APPLE_NOTARY_KEY_P8_BASE64 APPLE_NOTARY_KEY_ID APPLE_NOTARY_ISSUER_ID; do
            [[ -n "${!name}" ]] || { echo "::error::Missing secret: $name"; exit 1; }
          done

      - name: Validate release tooling
        run: |
          python3 -m unittest discover -s Tests -p 'test_release*.py'
          bash Tests/run-update-checks.sh

      - name: Build universal app
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          xcodebuild -project Duotlet.xcodeproj -scheme Duotlet -configuration Release \
            -derivedDataPath build/DerivedData -destination 'generic/platform=macOS' \
            CODE_SIGNING_ALLOWED=NO ARCHS="arm64 x86_64" ONLY_ACTIVE_ARCH=NO \
            MARKETING_VERSION="$APP_VERSION" CURRENT_PROJECT_VERSION="$APP_VERSION" \
            DUOTLET_APP_GROUP="${APPLE_TEAM_ID:-group}.app.duotlet.shared" build
          ditto build/DerivedData/Build/Products/Release/Duotlet.app "$APP_PATH"
          lipo "$APP_PATH/Contents/MacOS/Duotlet" -verify_arch arm64 x86_64

      - name: Install Developer ID credentials
        if: vars.DEVELOPER_ID_ENABLED == 'true'
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_NOTARY_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          CERTIFICATE_PATH="$RUNNER_TEMP/developer-id.p12"
          NOTARY_KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          {
            echo "NOTARY_KEY_PATH=$NOTARY_KEY_PATH"
            echo "KEYCHAIN_PATH=$KEYCHAIN_PATH"
          } >> "$GITHUB_ENV"
          printf '%s' "$APPLE_CERTIFICATE_P12_BASE64" | base64 --decode -o "$CERTIFICATE_PATH"
          printf '%s' "$APPLE_NOTARY_KEY_P8_BASE64" | base64 --decode -o "$NOTARY_KEY_PATH"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -k "$KEYCHAIN_PATH" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security -t cert -f pkcs12 >/dev/null
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          IDENTITIES="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | awk \
            -v team="$APPLE_TEAM_ID" \
            '/Developer ID Application:/ && index($0, "(" team ")") { print $2 }')"
          [[ "$IDENTITIES" =~ ^[A-Fa-f0-9]{40}$ ]] || {
            echo "::error::Expected exactly one valid Developer ID Application identity for the configured team"
            exit 1
          }
          echo "::add-mask::$IDENTITIES"
          echo "SIGNING_IDENTITY=$IDENTITIES" >> "$GITHUB_ENV"

      - name: Sign release app
        if: vars.DEVELOPER_ID_ENABLED == 'true'
        env:
          APP_VERSION: ${{ steps.meta.outputs.version }}
          BUILD_VERSION: ${{ steps.meta.outputs.build }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $APP_VERSION" "$APP_PATH/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_VERSION" "$APP_PATH/Contents/Info.plist"
          CONTROL_PATH="$APP_PATH/Contents/PlugIns/DuotletControl.appex"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $APP_VERSION" "$CONTROL_PATH/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_VERSION" "$CONTROL_PATH/Contents/Info.plist"
          python3 scripts/release-entitlements.py "$APPLE_TEAM_ID.app.duotlet.shared" "$RUNNER_TEMP"
          codesign --force --sign "$SIGNING_IDENTITY" --keychain "$KEYCHAIN_PATH" \
            --timestamp --options runtime --entitlements "$RUNNER_TEMP/control.entitlements" "$CONTROL_PATH"
          codesign --force --sign "$SIGNING_IDENTITY" --keychain "$KEYCHAIN_PATH" \
            --timestamp --options runtime --entitlements "$RUNNER_TEMP/app.entitlements" "$APP_PATH"
          codesign --verify --deep --strict --all-architectures "$APP_PATH"
          INFO="$(codesign -dv --verbose=4 "$APP_PATH" 2>&1)"
          TEAM="$(printf '%s\n' "$INFO" | awk -F= '/^TeamIdentifier=/{print $2}')"
          [[ "$TEAM" == "$APPLE_TEAM_ID" ]] || { echo "::error::Unexpected signing team"; exit 1; }
          printf '%s\n' "$INFO" | grep -q '^Authority=Developer ID Application:'
          printf '%s\n' "$INFO" | grep -q '^Timestamp='
          printf '%s\n' "$INFO" | grep -q 'flags=.*runtime'

      - name: Package DMG
        env:
          DMG_NAME: ${{ steps.meta.outputs.dmg }}
        run: |
          set -euo pipefail
          mkdir -p "$DIST_PATH"
          STAGING="$(mktemp -d "$RUNNER_TEMP/dmg-staging.XXXXXX")"
          trap 'rm -rf "$STAGING"' EXIT
          ditto "$APP_PATH" "$STAGING/Duotlet.app"
          ln -s /Applications "$STAGING/Applications"
          DMG_PATH="$DIST_PATH/$DMG_NAME"
          hdiutil create -volname 'Duotlet' -srcfolder "$STAGING" \
            -fs HFS+ -format UDZO "$DMG_PATH"
          if [[ -n "${SIGNING_IDENTITY:-}" ]]; then
            codesign --force --sign "$SIGNING_IDENTITY" --keychain "$KEYCHAIN_PATH" --timestamp "$DMG_PATH"
            codesign --verify --strict "$DMG_PATH"
          fi
          echo "DMG_PATH=$DMG_PATH" >> "$GITHUB_ENV"

      - name: Notarize DMG
        if: vars.DEVELOPER_ID_ENABLED == 'true'
        env:
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          SUBMISSION_JSON="$RUNNER_TEMP/notary-submission.json"
          NOTARY_LOG="$RUNNER_TEMP/notary-log.json"
          SUBMIT_EXIT=0
          xcrun notarytool submit "$DMG_PATH" \
            --key "$NOTARY_KEY_PATH" --key-id "$APPLE_NOTARY_KEY_ID" \
            --issuer "$APPLE_NOTARY_ISSUER_ID" \
            --wait --timeout 30m --output-format json > "$SUBMISSION_JSON" || SUBMIT_EXIT=$?
          SUBMISSION_ID="$(plutil -extract id raw -o - "$SUBMISSION_JSON" 2>/dev/null || true)"
          STATUS="$(plutil -extract status raw -o - "$SUBMISSION_JSON" 2>/dev/null || true)"
          if [[ "$SUBMIT_EXIT" -ne 0 || "$STATUS" != Accepted ]]; then
            if [[ -n "$SUBMISSION_ID" ]]; then
              xcrun notarytool log "$SUBMISSION_ID" \
                --key "$NOTARY_KEY_PATH" --key-id "$APPLE_NOTARY_KEY_ID" \
                --issuer "$APPLE_NOTARY_ISSUER_ID" "$NOTARY_LOG" || true
            fi
            echo "::error::Notarization did not return Accepted (exit $SUBMIT_EXIT, status $STATUS)"
            exit 1
          fi

      - name: Staple notarization tickets
        if: vars.DEVELOPER_ID_ENABLED == 'true'
        run: |
          set -euo pipefail
          xcrun stapler staple "$DMG_PATH"
          xcrun stapler validate "$DMG_PATH"
          codesign --verify --strict "$DMG_PATH"
          xcrun stapler staple "$APP_PATH"
          xcrun stapler validate "$APP_PATH"

      - name: Package ZIP
        env:
          ZIP_NAME: ${{ steps.meta.outputs.zip }}
        run: |
          set -euo pipefail
          codesign --verify --strict --all-architectures "$APP_PATH"
          ZIP_PATH="$DIST_PATH/$ZIP_NAME"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "$ZIP_PATH"
          echo "ZIP_PATH=$ZIP_PATH" >> "$GITHUB_ENV"

      - name: Remove signing credentials
        if: always() && vars.DEVELOPER_ID_ENABLED == 'true'
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          CLEANUP_STATUS=0
          if [[ -e "$KEYCHAIN_PATH" ]]; then
            security delete-keychain "$KEYCHAIN_PATH" || CLEANUP_STATUS=$?
          fi
          rm -f "$RUNNER_TEMP/developer-id.p12" "$RUNNER_TEMP/AuthKey.p8"
          exit "$CLEANUP_STATUS"

      - name: Upload notarization diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: notarization-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/notary-*.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Duotlet-${{ steps.meta.outputs.label }}
          path: |
            build/release/*.dmg
            build/release/*.zip
          if-no-files-found: error

      - name: Write release notes
        env:
          BUILD_LABEL: ${{ steps.meta.outputs.label }}
          DEVELOPER_ID_ENABLED: ${{ vars.DEVELOPER_ID_ENABLED }}
        run: |
          set -euo pipefail
          {
            cat RELEASE_NOTES.md
            printf '\n\n'
            printf '**Duotlet %s**\n\n' "$BUILD_LABEL"
            printf 'Commit: `%s`\n\n' "$GITHUB_SHA"
            printf 'Open the DMG and drag **Duotlet** to **Applications**, or extract the ZIP.\n\n'
            printf 'Requires macOS 14 or later and a MacBook with a compatible lid angle sensor.\n'
            printf 'Includes Apple Silicon and Intel binaries.\n\n'
            printf 'Grant Screen Recording permission when prompted to enable the effect.\n'
            if [[ "$DEVELOPER_ID_ENABLED" != true ]]; then
              printf '\nThis build is not notarized by Apple. macOS may block the first launch; review the app before allowing it in Privacy & Security.\n'
              printf 'The Control Center extension requires Apple signing and is not supported in this build.\n'
            fi
          } > "$DIST_PATH/NOTES.md"

      - name: Publish stable release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TITLE: ${{ steps.meta.outputs.title }}
        run: |
          set -euo pipefail
          # Never replace published binaries or make an older version the latest release.
          gh api --paginate --slurp "repos/$GH_REPO/releases" > "$RUNNER_TEMP/releases.json"
          python3 scripts/release_metadata.py "$GITHUB_REF_NAME" --releases "$RUNNER_TEMP/releases.json"
          if gh release view "$GITHUB_REF_NAME" --json isDraft > "$RUNNER_TEMP/release.json" 2>/dev/null; then
            [[ "$(plutil -extract isDraft raw -o - "$RUNNER_TEMP/release.json")" == true ]]
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --draft \
              --title "$RELEASE_TITLE" --notes-file "$DIST_PATH/NOTES.md"
          fi
          gh release upload "$GITHUB_REF_NAME" "$DMG_PATH" "$ZIP_PATH" --clobber
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest \
            --title "$RELEASE_TITLE" --notes-file "$DIST_PATH/NOTES.md"
