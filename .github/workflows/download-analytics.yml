name: Download analytics

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/download-analytics.yml'
      - 'scripts/download-analytics.py'
      - 'Tests/test_download_analytics.py'

permissions:
  contents: write

concurrency:
  group: download-analytics
  cancel-in-progress: false

jobs:
  collect:
    if: github.repository == 'sahranov/Duotlet'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Verify analytics calculations
        run: python3 -m unittest discover -s Tests -p 'test_download_analytics.py'

      - name: Open persistent analytics history
        shell: bash
        run: |
          set -euo pipefail
          DATA_DIR="$RUNNER_TEMP/duotlet-analytics-data"
          echo "DATA_DIR=$DATA_DIR" >> "$GITHUB_ENV"
          # Fail on transport errors; only a genuinely absent branch starts new history.
          REMOTE_REF="$(git ls-remote --heads origin refs/heads/analytics-data)"
          if [[ -n "$REMOTE_REF" ]]; then
            git fetch origin refs/heads/analytics-data
            git worktree add --detach "$DATA_DIR" FETCH_HEAD
          else
            git worktree add --detach "$DATA_DIR" HEAD
            git -C "$DATA_DIR" checkout --orphan analytics-data
            git -C "$DATA_DIR" rm -rf .
          fi

      - name: Collect public download counters
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/download-analytics.py --output-dir "$DATA_DIR"

      - name: Save report and full history
        shell: bash
        run: |
          set -euo pipefail
          git -C "$DATA_DIR" config user.name 'github-actions[bot]'
          git -C "$DATA_DIR" config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C "$DATA_DIR" add README.md history.json downloads.csv
          git -C "$DATA_DIR" commit -m "Update download analytics"
          git -C "$DATA_DIR" push origin HEAD:refs/heads/analytics-data
